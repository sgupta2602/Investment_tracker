<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Investment Tracker{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="bg-slate-900 text-white px-6 py-4">
    <h1 class="text-xl font-semibold"> Investment Tracker</h1>
    <p class="text-slate-300 text-sm">Automated trade gain/loss &amp; tax reporting from your broker CSV</p>
  </header>
  <main class="p-6 max-w-6xl mx-auto">
    {% block content %}{% endblock %}
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Investment Tracker{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <header class="bg-gradient-to-r from-indigo-600 via-violet-600 to-fuchsia-600 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-6 py-5 flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight">Investment Tracker</h1>
        <p class="text-indigo-100 text-sm">Automated trade gain/loss &amp; tax reporting from your broker CSV</p>
      </div>
      <nav class="flex gap-2" aria-label="Main navigation">
        <a href="/overview"
           class="px-4 py-2 rounded-full bg-white/15 hover:bg-white/25 font-semibold text-sm transition focus:outline-none focus:ring-2 focus:ring-white">
          Overview
        </a>
        <a href="/glossary"
           class="px-4 py-2 rounded-full bg-white/15 hover:bg-white/25 font-semibold text-sm transition focus:outline-none focus:ring-2 focus:ring-white">
          Glossary
        </a>
        <a href="/upload"
           class="px-4 py-2 rounded-full bg-white text-indigo-700 hover:bg-indigo-50 font-semibold text-sm transition focus:outline-none focus:ring-2 focus:ring-white">
          Upload New Statement
        </a>
      </nav>
    </div>
  </header>
  <main class="p-6 max-w-6xl mx-auto">
    {% block content %}{% endblock %}
  </main>
</body>
</html>

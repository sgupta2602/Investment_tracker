<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Investment Tracker{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
  <header class="bg-slate-900 border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-6 py-5 flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-white">Investment Tracker</h1>
        <p class="text-slate-400 text-sm">Automated trade gain/loss &amp; tax reporting from your broker CSV</p>
      </div>
      <nav class="flex gap-2" aria-label="Main navigation">
        <a href="/overview"
           class="px-4 py-2 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm transition focus:outline-none focus:ring-2 focus:ring-cyan-500">
          Overview
        </a>
        <a href="/glossary"
           class="px-4 py-2 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm transition focus:outline-none focus:ring-2 focus:ring-cyan-500">
          Glossary
        </a>
        <a href="/upload"
           class="px-4 py-2 rounded-md bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-sm transition focus:outline-none focus:ring-2 focus:ring-cyan-400">
          Upload New Statement
        </a>
      </nav>
    </div>
  </header>
  <main class="p-6 max-w-6xl mx-auto">
    {% block content %}{% endblock %}
  </main>
</body>
</html>

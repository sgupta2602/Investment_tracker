<h2 class="text-lg font-bold mb-3 text-slate-100">Monthly Performance</h2>
{% if not month_trades %}
<p class="text-slate-400 text-sm">No closed trades in this upload.</p>
{% else %}
<dl class="grid grid-cols-1 sm:grid-cols-4 gap-4">
  <div class="rounded-xl border border-slate-800 bg-slate-900 p-4">
    <dt class="text-xs uppercase tracking-wide text-slate-500">Realized Investment</dt>
    <dd class="text-xl font-extrabold mt-1 text-slate-100">{{ performance.realized_investment | usd }}</dd>
  </div>
  <div class="rounded-xl border border-slate-800 bg-slate-900 p-4">
    <dt class="text-xs uppercase tracking-wide text-slate-500">Cost Basis</dt>
    <dd class="text-xl font-extrabold mt-1 text-slate-100">{{ performance.cost_basis | usd }}</dd>
  </div>
  <div class="rounded-xl border border-slate-800 bg-slate-900 p-4">
    <dt class="text-xs uppercase tracking-wide text-slate-500">Gain</dt>
    <dd class="text-xl font-extrabold mt-1 {{ 'text-emerald-400' if performance.gain >= 0 else 'text-rose-400' }}">{{ performance.gain | usd }}</dd>
  </div>
  <div class="rounded-xl border border-slate-800 bg-slate-900 p-4">
    <dt class="text-xs uppercase tracking-wide text-slate-500">Yield</dt>
    <dd class="text-xl font-extrabold mt-1 {{ 'text-emerald-400' if performance.yield_pct >= 0 else 'text-rose-400' }}">{{ performance.yield_pct | pct }}</dd>
  </div>
</dl>
{% endif %}

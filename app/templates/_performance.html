<h2 class="text-lg font-bold mb-3 text-slate-800">Monthly Performance</h2>
{% if not month_trades %}
<p class="text-slate-600 text-sm">No closed trades in this upload.</p>
{% else %}
<dl class="grid grid-cols-1 sm:grid-cols-4 gap-4">
  <div class="rounded-xl shadow-lg p-4 text-white bg-gradient-to-br from-sky-500 to-blue-600">
    <dt class="text-xs uppercase tracking-wide text-sky-100">Realized Investment</dt>
    <dd class="text-xl font-extrabold mt-1">{{ performance.realized_investment | usd }}</dd>
  </div>
  <div class="rounded-xl shadow-lg p-4 text-white bg-gradient-to-br from-violet-500 to-purple-600">
    <dt class="text-xs uppercase tracking-wide text-violet-100">Cost Basis</dt>
    <dd class="text-xl font-extrabold mt-1">{{ performance.cost_basis | usd }}</dd>
  </div>
  <div class="rounded-xl shadow-lg p-4 text-white {{ 'bg-gradient-to-br from-emerald-500 to-green-600' if performance.gain >= 0 else 'bg-gradient-to-br from-rose-500 to-red-600' }}">
    <dt class="text-xs uppercase tracking-wide text-white/80">Gain</dt>
    <dd class="text-xl font-extrabold mt-1">{{ performance.gain | usd }}</dd>
  </div>
  <div class="rounded-xl shadow-lg p-4 text-white bg-gradient-to-br from-amber-400 to-orange-500">
    <dt class="text-xs uppercase tracking-wide text-amber-50">Yield</dt>
    <dd class="text-xl font-extrabold mt-1">{{ performance.yield_pct | pct }}</dd>
  </div>
</dl>
{% endif %}

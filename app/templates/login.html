<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Investment Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm bg-slate-900 border border-slate-800 border-t-4 border-t-cyan-500 rounded-2xl shadow-xl p-8">
    <h1 class="text-xl font-extrabold text-white mb-1">Investment Tracker</h1>
    <p class="text-sm text-slate-400 mb-6">Sign in to continue.</p>

    {% if error %}
    <div class="rounded-lg border border-rose-500/30 bg-rose-500/10 text-rose-300 text-sm px-3 py-2 mb-4" role="alert">
      {{ error }}
    </div>
    {% endif %}

    <form action="/login" method="post" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-semibold mb-1 text-slate-300">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          autofocus
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          class="block w-full text-sm text-slate-100 bg-slate-950 border border-slate-700 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-cyan-500"
        />
      </div>
      <div>
        <label for="password" class="block text-sm font-semibold mb-1 text-slate-300">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          class="block w-full text-sm text-slate-100 bg-slate-950 border border-slate-700 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-cyan-500"
        />
      </div>
      <button
        type="submit"
        class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg py-2.5 shadow-lg transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-cyan-400"
      >
        Sign In
      </button>
    </form>
  </div>
</body>
</html>
